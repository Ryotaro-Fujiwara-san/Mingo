
name: Deploy Mingo to ECS Express

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: mingo-production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  AWS_ACCOUNT_ID: "656051538064"
  ECS_CLUSTER: default
  ECS_SERVICE: mingo
  ECR_REPOSITORY: mingo

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  deploy:
    needs: test
    if: ${{ vars.AUTO_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker build --file Dockerfile --tag "$IMAGE_URI" .
          docker push "$IMAGE_URI"

          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Register task definition with persistent EFS volume
        env:
          EFS_FILE_SYSTEM_ID: ${{ vars.EFS_FILE_SYSTEM_ID }}
          EFS_ACCESS_POINT_ID: ${{ vars.EFS_ACCESS_POINT_ID }}
        run: |
          set -euo pipefail

          if [[ -z "$EFS_FILE_SYSTEM_ID" || -z "$EFS_ACCESS_POINT_ID" ]]; then
            echo "::error::Set the EFS_FILE_SYSTEM_ID and EFS_ACCESS_POINT_ID repository variables before enabling deployment."
            exit 1
          fi

          SERVICE_ARN="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].serviceArn' \
            --output text)"
          CURRENT_TASK_DEFINITION="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)"

          if [[ -z "$SERVICE_ARN" || "$SERVICE_ARN" == "None" || \
                -z "$CURRENT_TASK_DEFINITION" || "$CURRENT_TASK_DEFINITION" == "None" ]]; then
            echo "::error::Could not find the configured ECS service and its task definition."
            exit 1
          fi

          python - "$CURRENT_TASK_DEFINITION" "$IMAGE_URI" "$RUNNER_TEMP/task-definition.json" <<'PY'
          import json
          import os
          import subprocess
          import sys

          current_task_definition, image_uri, output_path = sys.argv[1:]
          task_definition = json.loads(subprocess.check_output([
              "aws", "ecs", "describe-task-definition",
              "--task-definition", current_task_definition,
              "--query", "taskDefinition",
              "--output", "json",
          ]))

          for field in (
              "taskDefinitionArn", "revision", "status", "requiresAttributes",
              "compatibilities", "registeredAt", "registeredBy",
          ):
              task_definition.pop(field, None)

          containers = [
              container for container in task_definition["containerDefinitions"]
              if container["name"] == "Main"
          ]
          if len(containers) != 1:
              raise SystemExit("Expected exactly one ECS Express primary container named Main.")

          container = containers[0]
          container["image"] = image_uri
          environment = {
              item["name"]: item for item in container.get("environment", [])
          }
          environment["MEMO_DB_PATH"] = {
              "name": "MEMO_DB_PATH",
              "value": "/mnt/mingo-data/memo.db",
          }
          environment["MEMO_DB_REQUIRE_PERSISTENT"] = {
              "name": "MEMO_DB_REQUIRE_PERSISTENT",
              "value": "true",
          }
          container["environment"] = list(environment.values())

          mount_points = [
              mount for mount in container.get("mountPoints", [])
              if mount["containerPath"] != "/mnt/mingo-data"
          ]
          mount_points.append({
              "sourceVolume": "mingo-data",
              "containerPath": "/mnt/mingo-data",
              "readOnly": False,
          })
          container["mountPoints"] = mount_points

          task_definition["volumes"] = [
              volume for volume in task_definition.get("volumes", [])
              if volume["name"] != "mingo-data"
          ] + [{
              "name": "mingo-data",
              "efsVolumeConfiguration": {
                  "fileSystemId": os.environ["EFS_FILE_SYSTEM_ID"],
                  "rootDirectory": "/",
                  "transitEncryption": "ENABLED",
                  "authorizationConfig": {
                      "accessPointId": os.environ["EFS_ACCESS_POINT_ID"],
                      "iam": "DISABLED",
                  },
              },
          }]

          with open(output_path, "w", encoding="utf-8") as task_file:
              json.dump(task_definition, task_file)
          PY

          TASK_DEFINITION_ARN="$(aws ecs register-task-definition \
            --cli-input-json "file://$RUNNER_TEMP/task-definition.json" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"

          aws ecs update-express-gateway-service \
            --service-arn "$SERVICE_ARN" \
            --task-definition-arn "$TASK_DEFINITION_ARN" \
            --scaling-target '{"minTaskCount":1,"maxTaskCount":1}'

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
