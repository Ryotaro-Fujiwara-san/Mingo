name: Deploy Mingo to ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: mingo-production-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install -r backend/requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  deploy:
    needs: test
    if: ${{ vars.AUTO_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-1
      ECS_CLUSTER: default
      ECS_SERVICE: mingo
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get current task definition and ECR repository
        id: current
        shell: bash
        run: |
          TASK_DEFINITION_ARN="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)"
          if [ -z "$TASK_DEFINITION_ARN" ] || [ "$TASK_DEFINITION_ARN" = "None" ]; then
            echo "Could not find the ECS service task definition." >&2
            exit 1
          fi

          CURRENT_IMAGE="$(aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION_ARN" \
            --query 'taskDefinition.containerDefinitions[0].image' \
            --output text)"
          REPOSITORY_URI="${CURRENT_IMAGE%@*}"
          REPOSITORY_URI="${REPOSITORY_URI%:*}"
          REGISTRY="${REPOSITORY_URI%%/*}"
          if [ "$REGISTRY" = "$REPOSITORY_URI" ]; then
            echo "The current task image is not an ECR image: $CURRENT_IMAGE" >&2
            exit 1
          fi

          echo "task_definition_arn=$TASK_DEFINITION_ARN" >> "$GITHUB_OUTPUT"
          echo "repository_uri=$REPOSITORY_URI" >> "$GITHUB_OUTPUT"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${{ steps.current.outputs.registry }}"

      - name: Build and push image
        env:
          IMAGE_URI: ${{ steps.current.outputs.repository_uri }}:${{ github.sha }}
        run: |
          docker build --file Dockerfile --tag "$IMAGE_URI" .
          docker push "$IMAGE_URI"

      - name: Register task definition and deploy
        env:
          IMAGE_URI: ${{ steps.current.outputs.repository_uri }}:${{ github.sha }}
          TASK_DEFINITION_ARN: ${{ steps.current.outputs.task_definition_arn }}
        shell: bash
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION_ARN" \
            --query taskDefinition \
            --output json > task-definition.json

          jq --arg image "$IMAGE_URI" '
            .containerDefinitions[0].image = $image
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy,
                .deregisteredAt
              )
          ' task-definition.json > task-definition-input.json

          NEW_TASK_DEFINITION_ARN="$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-input.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$NEW_TASK_DEFINITION_ARN"

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
