
name: Deploy Mingo to ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: mingo-production-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  deploy:
    needs: test
    if: ${{ vars.AUTO_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-northeast-1
      ECS_CLUSTER: default
      ECS_SERVICE: mingo

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Get current task definition and ECR repository
        id: current
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking ECS service..."
          echo "Region: $AWS_REGION"
          echo "Cluster: $ECS_CLUSTER"
          echo "Service: $ECS_SERVICE"

          aws ecs describe-services \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --output json > services.json

          echo "=== ECS service status ==="
          jq '{
            failures: .failures,
            services: [
              .services[]? | {
                serviceName,
                status,
                taskDefinition
              }
            ]
          }' services.json

          if [ "$(jq '.services | length' services.json)" -eq 0 ]; then
            echo "::error::ECS service was not returned by AWS."
            echo "Check the AWS account, region, cluster, service name, and IAM permissions."
            exit 1
          fi

          TASK_DEFINITION_ARN="$(jq -r \
            '.services[0].taskDefinition // empty' services.json)"

          if [ -z "$TASK_DEFINITION_ARN" ] || \
             [ "$TASK_DEFINITION_ARN" = "None" ]; then
            echo "::error::The ECS service has no task definition ARN."
            exit 1
          fi

          echo "Task definition: $TASK_DEFINITION_ARN"

          aws ecs describe-task-definition \
            --region "$AWS_REGION" \
            --task-definition "$TASK_DEFINITION_ARN" \
            --query taskDefinition \
            --output json > task-definition.json

          CURRENT_IMAGE="$(jq -r \
            '.containerDefinitions[0].image // empty' \
            task-definition.json)"

          if [ -z "$CURRENT_IMAGE" ] || \
             [ "$CURRENT_IMAGE" = "None" ]; then
            echo "::error::Could not find a container image in the task definition."
            exit 1
          fi

          echo "Current image: $CURRENT_IMAGE"

          REPOSITORY_URI="${CURRENT_IMAGE%@*}"
          REPOSITORY_URI="${REPOSITORY_URI%:*}"
          REGISTRY="${REPOSITORY_URI%%/*}"

          if [ "$REGISTRY" = "$REPOSITORY_URI" ] || \
             [[ "$REGISTRY" != *.dkr.ecr.*.amazonaws.com ]]; then
            echo "::error::The current image is not an ECR image: $CURRENT_IMAGE"
            exit 1
          fi

          echo "task_definition_arn=$TASK_DEFINITION_ARN" >> "$GITHUB_OUTPUT"
          echo "repository_uri=$REPOSITORY_URI" >> "$GITHUB_OUTPUT"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Log in to Amazon ECR
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.current.outputs.registry }}
        run: |
          set -euo pipefail

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login \
                --username AWS \
                --password-stdin "$ECR_REGISTRY"

      - name: Build and push image
        shell: bash
        env:
          IMAGE_URI: ${{ steps.current.outputs.repository_uri }}:${{ github.sha }}
        run: |
          set -euo pipefail

          docker build --file Dockerfile --tag "$IMAGE_URI" .
          docker push "$IMAGE_URI"

      - name: Register task definition and deploy
        shell: bash
        env:
          IMAGE_URI: ${{ steps.current.outputs.repository_uri }}:${{ github.sha }}
          TASK_DEFINITION_ARN: ${{ steps.current.outputs.task_definition_arn }}
        run: |
          set -euo pipefail

          echo "Preparing new task definition..."

          aws ecs describe-task-definition \
            --region "$AWS_REGION" \
            --task-definition "$TASK_DEFINITION_ARN" \
            --query taskDefinition \
            --output json > task-definition.json

          jq --arg image "$IMAGE_URI" '
            .containerDefinitions[0].image = $image
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy,
                .deregisteredAt
              )
          ' task-definition.json > task-definition-input.json

          echo "Registering new task definition..."

          NEW_TASK_DEFINITION_ARN="$(aws ecs register-task-definition \
            --region "$AWS_REGION" \
            --cli-input-json file://task-definition-input.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"

          if [ -z "$NEW_TASK_DEFINITION_ARN" ] || \
             [ "$NEW_TASK_DEFINITION_ARN" = "None" ]; then
            echo "::error::Failed to register the new task definition."
            exit 1
          fi

          echo "New task definition: $NEW_TASK_DEFINITION_ARN"
          echo "Updating ECS service..."

          aws ecs update-service \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$NEW_TASK_DEFINITION_ARN"

          echo "Waiting for ECS service to become stable..."

          aws ecs wait services-stable \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

          echo "Deployment completed successfully."
